
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Configurar página web</title>
</head>
<body>

    <h1 align="center">Configura tu página web</h1>

    <form action="Ejercicio3.php" method="post">

        <p>
            <label>Color de fondo:</label>
            <select name="fondo">
                <option value="white">Blanco</option>
                <option value="lightblue">Azul claro</option>
                <option value="lightgreen">Verde claro</option>
                <option value="yellow">Amarillo</option>
                <option value="pink">Rosa</option>
            </select>
        </p>

        <p>
            <label>Tipo de letra:</label>
            <select name="fuente">
                <option value="Arial">Arial</option>
                <option value="Verdana">Verdana</option>
                <option value="Georgia">Georgia</option>
                <option value="Courier New">Courier New</option>
                <option value="Tahoma">Tahoma</option>
            </select>
        </p>

        <p>
            <label>Alineación del texto:</label>
            <select name="alineacion">
                <option value="left">Izquierda</option>
                <option value="center">Centro</option>
                <option value="right">Derecha</option>
                <option value="justify">Justificado</option>
            </select>
        </p>

        <p>
            <label>Imagen del banner:</label>
            <select name="banner">
                <option value="Sevilla.jpg">Sevilla</option>
                <option value="Madrid.jpg">Madrid</option>
                <option value="Barcelona.jpeg">Barcelona</option>
            </select>
        </p>

        <p>
            <label>Color del texto:</label>
            <select name="color">
                <option value="black">Negro</option>
                <option value="blue">Azul</option>
                <option value="red">Rojo</option>
                <option value="green">Verde</option>
                <option value="purple">Morado</option>
            </select>
        </p>

        <p>
            <label>Tamaño de letra:</label>
            <select name="tamano">
                <option value="3">Normal</option>
                <option value="4">Grande</option>
                <option value="5">Muy grande</option>
                <option value="6">Enorme</option>
            </select>
        </p>

        <p>
            <label>Color de los títulos:</label>
            <select name="colorTitulo">
                <option value="blue">Azul</option>
                <option value="red">Rojo</option>
                <option value="green">Verde</option>
                <option value="black">Negro</option>
                <option value="purple">Morado</option>
            </select>
        </p>

        <p>
            <label>Título de la página:</label>
            <input type="text" name="titulo"
                   value="Mi página personalizada" required>
        </p>

        <p>
            <input type="submit" value="Crear página">
            <input type="reset" value="Borrar selección">
        </p>

    </form>

</body>
</html>
